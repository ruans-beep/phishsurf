{% extends "base.html" %}
{% block title %}New scan · Phishsurf{% endblock %}
{% block content %}
<div class="card">
  <h1>New scan</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/scans">
    <label for="domain">Brand domain</label>
    <input type="text" id="domain" name="domain" placeholder="truniagen.com" required>

    <div class="row">
      <div>
        <label for="days">Lookback days</label>
        <input type="number" id="days" name="days" value="{{ default_days }}" min="1" max="365">
      </div>
      <div>
        <label for="limit">Result limit</label>
        <input type="number" id="limit" name="limit" value="{{ default_limit }}" min="1" max="3000">
      </div>
    </div>

    <button type="submit">Scan</button>
  </form>
  <p class="muted">Candidates for human review. Do not file a takedown from score alone.</p>
</div>
{% endblock %}
